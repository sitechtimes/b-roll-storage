info:
  name: Fetch Media by Filter
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/medias/filter?type=video"
  params:
    - name: type
      value: video
      type: query
    - name: title
      value: Deniz
      type: query
      disabled: true
    - name: strict
      value: "false"
      type: query
      disabled: true
    - name: tags
      value: pigeon,duck
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
